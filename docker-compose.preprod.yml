services:
  mysql:
    image: mysql:8.0
    container_name: agorium-db-preprod
    restart: always
    env_file:
      - .env
      - .env.preprod
    environment:
      MYSQL_ROOT_PASSWORD: caS>13200.ago
      MYSQL_DATABASE: agorium_db_preprod
      MYSQL_USER: admin
      MYSQL_PASSWORD: azerty
    volumes:
      - mysql-data-preprod:/var/lib/mysql
    networks:
      - proxy

  redis:
    image: redis:7-alpine
    container_name: agorium-redis-preprod
    restart: always
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data-preprod:/data
    networks:
      - proxy

  backend:
    build: ./backend
    container_name: agorium-backend-preprod
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
      - .env.preprod
    environment:
      - NODE_ENV=preprod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - proxy
    volumes:
      - ./backend:/app
      - /home/gamma/agorium-preprod-uploads:/app/public/uploads
    command: >
      sh -c "
        npm install &&
        dockerize -wait tcp://agorium-db-preprod:3306 -wait tcp://redis:6379 -timeout 60s &&
        npx sequelize-cli db:migrate &&
        node ./bin/www"

  worker:
    build: ./backend
    container_name: agorium-worker-preprod
    restart: always
    depends_on:
      - redis
      - mysql
    env_file:
      - .env
      - .env.preprod
    environment:
      - NODE_ENV=preprod
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - /home/gamma/agorium-preprod-uploads:/app/public/uploads
    command: node ./workers/videoWorker.js
    networks:
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_MODE: preprod
    container_name: agorium-frontend-preprod
    depends_on:
      - backend
    env_file:
      - .env
      - .env.preprod
    networks:
      - proxy

volumes:
  mysql-data-preprod:
  redis-data-preprod:

networks:
  proxy:
    external: true
