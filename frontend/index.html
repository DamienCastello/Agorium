<!DOCTYPE html>
<html lang="" data-theme="light">

<head>
  <meta charset="UTF-8">
<script>
  window.environment = {};
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/env.json?' + Date.now(), false);
    xhr.send(null);
    if (xhr.status === 200) window.environment = JSON.parse(xhr.responseText);
  } catch (e) {}
</script>
